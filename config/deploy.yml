# Name of your application. Used to uniquely configure containers.
service: project_tracker

# Name of the container image. On ghcr.io this is <github-user>/<image>.
image: your-github-user/project_tracker

# Deploy to these servers.
#
# One VPS (§12). 203.0.113.10 is a documentation address and is not a server:
# replace it with the IP of yours, and see README.md for what has to exist on it
# before the first deploy.
servers:
  web:
    - 203.0.113.10

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# Let's Encrypt terminates TLS here and forwards to the container over plain
# http inside the machine. production.rb pairs with this: assume_ssl, so the app
# knows the original request was https, and force_ssl, so anything arriving over
# http is redirected.
#
# `host` must be the same hostname as APP_HOST below. If they differ the proxy
# routes a name config.hosts rejects, and every page is a 403 with a healthy
# container and a valid certificate. A test asserts they match.
proxy:
  ssl: true
  host: tracker.example.com

# Where you keep your container images.
registry:
  # ghcr.io because the repository is already on GitHub and phase 9 pushes the
  # image from Actions, where the token is issued to the workflow rather than
  # stored. Any registry works; this one is one fewer account.
  server: ghcr.io
  username: your-github-user

  # An access token, never a password. See .kamal/secrets.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # The hostname this app is served as. production.rb raises without it rather
    # than leaving host authorization off, so this is not optional — and it must
    # match proxy.host above.
    APP_HOST: tracker.example.com

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use project_tracker-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# §12: "a container redeploy without it silently destroys every project, epic,
# story, and task." The SQLite databases live in /rails/storage, so this mount is
# the only thing that outlives a container.
#
# A host path rather than a Docker named volume, deliberately.
# script/backup_database runs on the server as an ordinary process and opens the
# database file directly — which is what lets SQLite's locks work while the app
# keeps writing. A named volume is reachable only through Docker, and the backup
# would then depend on the deploy tooling being healthy on the day it is needed
# most.
#
# The directory must exist and belong to uid 1000 before the first deploy: that
# is the user the container runs as, and Docker creates a missing bind mount as
# root. The app then starts, reads fine, and fails on the first write. README.md
# has the two commands.
volumes:
  - "/var/lib/project_tracker/storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.5
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: valkey/valkey:8
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
