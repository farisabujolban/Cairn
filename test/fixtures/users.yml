<% password_digest = BCrypt::Password.create("password") %>

# A system admin exists in every test run because sign-up is disabled: without
# one, no fixture-based test could create the first user or project.
admin:
  name: Ada Admin
  email_address: admin@example.com
  password_digest: <%= password_digest %>
  system_admin: true

one:
  name: One Member
  email_address: one@example.com
  password_digest: <%= password_digest %>

two:
  name: Two Member
  email_address: two@example.com
  password_digest: <%= password_digest %>

# Three and Four exist so Apollo holds all four roles at once: the §4 matrix is
# tested row by row, and every row needs a user in each column.
three:
  name: Three Admin
  email_address: three@example.com
  password_digest: <%= password_digest %>

four:
  name: Four Contributor
  email_address: four@example.com
  password_digest: <%= password_digest %>
